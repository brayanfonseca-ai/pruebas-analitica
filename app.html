<!DOCTYPE html>
<html lang="es" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>DataSense · Aplicación</title>
  <link rel="stylesheet" href="css/hub.css" />
  <link rel="stylesheet" href="css/editor.css" />
  <link rel="stylesheet" href="css/model.css" />
  <link rel="stylesheet" href="css/hoja.css" />
  <link rel="stylesheet" href="css/estrellita.css" />
  <link rel="stylesheet" href="css/informes.css" />
  <link rel="stylesheet" href="css/logico.css" />
  <link rel="stylesheet" href="css/datos.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css" />
</head>
<body>
  <!-- ===================== BARRA SUPERIOR (estilo Qlik) ===================== -->
  <header class="q-topbar q-app-topbar">
    <button class="q-apps" id="appsBtn" title="Ir al catálogo" aria-label="Ir al catálogo">
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </button>
    <div class="q-logo">
      <span class="q-logo-mark">◆</span>
      <span class="q-logo-text">DataSense</span>
      <span class="q-logo-sep">Aplicación</span>
    </div>
    <!-- Selector de vista: Inicio / Analizar / Narrar / Preparar / Lógica de negocio -->
    <div class="q-view-select" id="viewSelect"></div>

    <div class="q-app-crumb" title="Espacio / aplicación">
      <span class="q-app-space">Personal</span>
      <span class="q-app-slash">/</span>
      <strong id="appName">Aplicación</strong>
      <span class="q-crumb-menu" id="crumbMenu" hidden></span>
    </div>

    <div class="q-top-actions">
      <button class="q-top-ico" title="Ayuda" aria-label="Ayuda" disabled>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.5 1.5c0 1.5-2 2-2 3"/><circle cx="12" cy="17" r="0.6" fill="currentColor"/></svg>
      </button>
      <button class="q-top-ico" title="Notificaciones" aria-label="Notificaciones" disabled>
        <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      </button>
      <div class="q-profile">
        <button class="q-avatar" id="avatar" aria-haspopup="true" aria-expanded="false" title="Perfil">D</button>
        <div class="q-profile-pop" id="profilePop" hidden></div>
      </div>
    </div>
  </header>

  <div class="q-body">
    <!-- Contenedor de la vista activa (sin menú lateral: se navega con el selector) -->
    <main class="q-main" id="appView"></main>
  </div>

  <!-- CDNs globales (Chart.js + CodeMirror sql + SheetJS para previsualización) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/sql/sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
