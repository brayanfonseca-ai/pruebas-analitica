<!DOCTYPE html>
<html lang="es" translate="no">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>PROTHEO · Aplicación</title>
  <link rel="stylesheet" href="../css/hub.css" />
  <link rel="stylesheet" href="../css/editor.css" />
  <link rel="stylesheet" href="../css/model.css" />
  <link rel="stylesheet" href="../css/hoja.css" />
  <link rel="stylesheet" href="../css/estrellita.css" />
  <link rel="stylesheet" href="../css/informes.css" />
  <link rel="stylesheet" href="../css/logico.css" />
  <link rel="stylesheet" href="../css/datos.css" />
  <link rel="stylesheet" href="../css/lab.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css" />
  <link rel="stylesheet" href="../css/theme.css" />
  <script src="../js/theme.js"></script>
  <script type="module" src="../js/topbar.js"></script>
</head>
<body>
  <!-- ===================== BARRA SUPERIOR ===================== -->
  <header class="q-topbar q-app-topbar">
    <div class="q-logo">
      <svg class="q-logo-mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="pthg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><path d="M16 3.2 27.1 9.6v12.8L16 28.8 4.9 22.4V9.6z" fill="#6366f1" fill-opacity=".16" stroke="url(#pthg)" stroke-width="2" stroke-linejoin="round"/><rect x="9.4" y="17.6" width="3.2" height="6.4" rx="1" fill="url(#pthg)" stroke="none"/><rect x="14.4" y="14.2" width="3.2" height="9.8" rx="1" fill="url(#pthg)" stroke="none"/><rect x="19.4" y="10.8" width="3.2" height="13.2" rx="1" fill="url(#pthg)" stroke="none"/><path d="M11 14.6 16 11.2l5-3.4" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><circle cx="11" cy="14.6" r="1.5" fill="#fff" stroke="none"/><circle cx="16" cy="11.2" r="1.5" fill="#fff" stroke="none"/><circle class="q-logo-node" cx="21" cy="7.8" r="1.9" fill="#22d3ee" stroke="#fff" stroke-width="1"/></svg>
      <span class="q-logo-text">PROTHEO</span>
    </div>

    <div class="q-app-crumb" title="Aplicación y etapa">
      <strong id="appName">Aplicación</strong>
      <span class="q-app-space">Personal</span>
      <span class="ds-crumb-view" id="crumbView"></span>
      <span class="q-crumb-menu" id="crumbMenu" hidden></span>
    </div>

    <div class="q-top-actions">
      <button class="q-top-ico" title="Ayuda" aria-label="Ayuda" disabled>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.5 1.5c0 1.5-2 2-2 3"/><circle cx="12" cy="17" r="0.6" fill="currentColor"/></svg>
      </button>
      <button class="q-top-ico" title="Notificaciones" aria-label="Notificaciones" disabled>
        <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      </button>
      <div class="q-profile">
        <button class="q-avatar" id="avatar" aria-haspopup="true" aria-expanded="false" title="Perfil">D</button>
        <div class="q-profile-pop" id="profilePop" hidden></div>
      </div>
    </div>
  </header>

  <div class="q-body">
    <!-- Menú lateral de la app (secciones agrupadas; se pliega con la hamburguesa) -->
    <aside class="q-side ds-app-side" id="side">
      <nav class="q-nav" id="nav"></nav>
    </aside>
    <main class="q-main" id="appView"></main>
  </div>

  <!-- CDNs globales (Chart.js + CodeMirror sql + SheetJS para previsualización) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/sql/sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
