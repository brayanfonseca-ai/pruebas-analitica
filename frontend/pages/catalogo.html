<!DOCTYPE html>
<html lang="es" translate="no">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>PROTHEO · Aplicaciones</title>
  <link rel="stylesheet" href="../css/hub.css" />
  <link rel="stylesheet" href="../css/editor.css" />
  <link rel="stylesheet" href="../css/model.css" />
  <link rel="stylesheet" href="../css/theme.css" />
  <script src="../js/theme.js"></script>
  <script type="module" src="../js/topbar.js"></script>
</head>
<body>
  <!-- ===================== TOP BAR ===================== -->
  <header class="q-topbar">
    <button class="q-apps" id="appsBtn" title="Ir al catálogo" aria-label="Aplicaciones">
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </button>
    <div class="q-logo">
      <svg class="q-logo-mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="pthg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><path d="M16 3.2 27.1 9.6v12.8L16 28.8 4.9 22.4V9.6z" fill="#6366f1" fill-opacity=".16" stroke="url(#pthg)" stroke-width="2" stroke-linejoin="round"/><rect x="9.4" y="17.6" width="3.2" height="6.4" rx="1" fill="url(#pthg)" stroke="none"/><rect x="14.4" y="14.2" width="3.2" height="9.8" rx="1" fill="url(#pthg)" stroke="none"/><rect x="19.4" y="10.8" width="3.2" height="13.2" rx="1" fill="url(#pthg)" stroke="none"/><path d="M11 14.6 16 11.2l5-3.4" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><circle cx="11" cy="14.6" r="1.5" fill="#fff" stroke="none"/><circle cx="16" cy="11.2" r="1.5" fill="#fff" stroke="none"/><circle class="q-logo-node" cx="21" cy="7.8" r="1.9" fill="#22d3ee" stroke="#fff" stroke-width="1"/></svg>
      <span class="q-logo-text">PROTHEO</span>
      <span class="q-logo-sep">Catálogo</span>
    </div>
    <div class="q-search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar aplicaciones" aria-label="Buscar aplicaciones" />
    </div>
    <div class="q-top-actions">
      <div class="q-avatar" id="avatar">D</div>
    </div>
  </header>

  <div class="q-body">
    <aside class="q-side"><nav class="q-nav" id="nav"></nav></aside>

    <main class="q-main">
      <div class="q-greeting">
        <h1>Aplicaciones</h1>
        <button class="q-ed-btn primary" id="newAppBtn">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          Crear aplicación
        </button>
      </div>

      <div class="q-filterbar" id="catFilters">
        <div class="ds-stage-filter" id="stageFilter" role="group" aria-label="Filtrar por etapa">
          <button type="button" class="ds-stage-f on" data-stage="">Todas</button>
          <button type="button" class="ds-stage-f" data-stage="personal">Personal</button>
          <button type="button" class="ds-stage-f" data-stage="desarrollo">Desarrollo</button>
          <button type="button" class="ds-stage-f" data-stage="produccion">Producción</button>
        </div>
        <label class="ds-check"><input type="checkbox" id="onlyMine" /> Solo mías</label>
      </div>

      <p class="q-muted" id="catalogHint" style="color:var(--q-muted);margin:0 0 18px;">
        Abre una aplicación para gestionar sus datos, modelar y analizar.
      </p>

      <div class="q-create-grid" id="appsGrid"></div>
    </main>
  </div>

  <!-- Modal: crear aplicación -->
  <div class="q-modal-backdrop" id="createBackdrop" hidden>
    <div class="q-modal">
      <div class="q-modal-head">
        <h2>Crear aplicación</h2>
        <button class="q-modal-x" id="createX" aria-label="Cerrar">✕</button>
      </div>
      <div class="q-modal-body">
        <label for="appName" style="font-size:.82rem;color:var(--q-muted);">Nombre de la aplicación</label>
        <input type="text" id="appName" placeholder="Mi aplicación"
          style="width:100%;margin-top:6px;padding:11px 13px;border:1px solid var(--q-border);border-radius:8px;outline:none;font-size:.95rem;" />
        <p class="q-upload-status" id="createStatus"></p>
      </div>
      <div class="q-modal-foot">
        <button class="q-ed-btn ghost" id="createCancel">Cancelar</button>
        <button class="q-ed-btn primary" id="createCommit">Crear y abrir</button>
      </div>
    </div>
  </div>

  <script type="module" src="../js/catalogo.js"></script>
</body>
</html>
